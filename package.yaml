name: battleship
version: 0.1.0
github: "Tommyhuy1705/Functional_Programming_Battle_Ship"
license: BSD3
author: "Tommyhu`y1705"
maintainer: "your.email@example.com"
copyright: "2025 Tommyhuy1705"

extra-source-files:
- README.md
- LICENSE

description: A networked Battleship game implementation in Haskell

dependencies:
  - base >= 4.7 && < 5
  - network
  - aeson
  - text
  - bytestring
  - containers
  - mtl
  - transformers
  - async
  - stm
  - threepenny-gui
  - random
  - postgresql-simple
  - random
  - cryptonite
  - base64-bytestring
  - directory
  - filepath
  - dotenv

library:
  source-dirs: src

executables:
  battleship-server:
    main: Main.hs
    source-dirs: app/server
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - battleship

  battleship-client:
    main: Main.hs
    source-dirs: app/client
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - battleship

  battleship-gui:
    main: Main.hs
    source-dirs: app/gui
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - battleship
    - threepenny-gui
    - random

tests:
  battleship-test:
    main: Spec.hs
    source-dirs: test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - battleship
    - hspec
    - QuickCheck